name: Daily Digest

on:
  # Primary trigger: an external scheduler (cron-job.org) calls workflow_dispatch at 07:30 Toronto.
  # GitHub cron below is only a backup; it is often hours late.
  schedule:
    # 07:30 America/Toronto: EDT (UTC-4) and EST (UTC-5); the guard step keeps only the matching one
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Schedule guard
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(TZ=America/Toronto date +%z)" = "-0400" ]; then expected="30 11 * * *"; else expected="30 12 * * *"; fi
          if [ "$SCHEDULE" != "$expected" ]; then
            echo "Schedule '$SCHEDULE' is not today's DST slot, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          since=$(date -u -d 'TZ="America/Toronto" today 00:00' +%Y-%m-%dT%H:%M:%SZ)
          sent=$(gh run list -R "$REPO" -w daily_run.yml -e workflow_dispatch -s success -L 20 \
                   --json createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | length")
          if [ "$sent" -gt 0 ]; then
            echo "Digest already sent today by workflow_dispatch, backup skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digest yet today, backup run proceeds"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send digest
        if: steps.guard.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Upload rendered email
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output.html
          if-no-files-found: ignore
          retention-days: 7
